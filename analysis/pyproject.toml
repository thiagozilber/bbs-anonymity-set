[project]
name = "bbs-anonymity-analysis"
version = "0.1.0"
description = "Population generator and partition analysis for the bbs-anonymity-set harness"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
popgen = "bbs_analysis.popgen:main"
partition = "bbs_analysis.partition:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bbs_analysis"

[tool.pytest.ini_options]
testpaths = ["tests"]
