# Example Issuer deployment policy for the age-verification domain (bbs-2023).
#
# Attribute names are terms of our PID context (packages/common/src/contexts.ts),
# named after the EUDI PID Rulebook. Each point in a parameter sweep is one file
# like this.

[schema]
# "omit": a Prover without an optional attribute gets a credential without that
# statement, so L is one smaller. "pad" has no bbs-2023 equivalent yet.
absent_optional = "omit"

# Attributes a credential may carry. Under bbs-2023 this order does not set
# message indexes; the canonical N-Quad order does.
[[schema.fields]]
name = "family_name"

[[schema.fields]]
name = "given_name"

[[schema.fields]]
name = "birth_date"

[[schema.fields]]
name = "age_over_18"

[[schema.fields]]
name = "nationality"

[[schema.fields]]
name = "resident_country"
optional = true

[[schema.fields]]
name = "resident_city"
optional = true

[[schema.fields]]
name = "issuing_country"

[proof]
# Statements always disclosed. Their N-Quads are hashed into the BBS header
# (proofHash || mandatoryHash) rather than signed as BBS messages. Making
# issuing_country mandatory gives one header value per issuing country, as the
# old header template "pid-age/v1/{issuing_country}" did, but the header also
# depends on the blank-node label shuffle (see README, "Binding channels").
mandatory_pointers = ["/issuer", "/credentialSubject/issuing_country"]
