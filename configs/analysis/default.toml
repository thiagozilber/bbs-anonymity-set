# Partition analysis config: which observation tuples to compute and at which
# population sizes.
#
# Field names are those of `observation` in the observer's output. A tuple is
# the list of field values; presentations with identical tuples form one
# class.

# Population sizes for the curves. Each point uses the first N Provers of the
# observation file (populations are prefix-consistent). Sizes above the
# number of Provers in the file are skipped; the full file is always the last
# point.
n = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000, 10000]

# The tuple as CLAUDE.md states it.
[tuples.core]
fields = ["u", "total_statements", "selective_indexes", "header"]

# Plus what the Prover disclosed.
[tuples.core_values]
fields = ["u", "total_statements", "selective_indexes", "header", "disclosed"]

# Everything the Verifier sees except the presentation header, which is fresh
# per proof in the random and nonce modes and would make every presentation
# its own class. Add "presentation_header" in a separate tuple to study the
# fixed (reuse) mode.
[tuples.full]
fields = [
  "u", "total_statements", "selective_indexes", "mandatory_indexes", "header",
  "label_map", "revealed_nquads", "issuer", "verification_method", "disclosed",
]
