[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
# Edition 2024 and resolver 3 need Cargo 1.85+.
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Pinned exactly. 0.7.1 cites draft-irtf-cfrg-bbs-signatures-12; its code and
# test fixtures are identical to 0.7.0, which cited draft-10.
zkryptium = { version = "=0.7.1", default-features = false, features = ["bbsplus"] }
elliptic-curve = { version = "0.13", features = ["hash2curve"] }
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
common = { path = "crates/common" }
